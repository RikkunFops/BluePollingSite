services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - TZ=Europe/London
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-blueboye.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    ports:
      - "80:80"
    volumes:
      - ./letsencrypt:/etc/letsencrypt

volumes:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge